function dhcpAssignLegacy(){let l=lab();journey([{routes:[['p1','sw','rt']],text:'1. Client: “I need network settings.”',onStart:()=>{l.dhcp=1;renderBench()}},{routes:[['rt','sw','p1']],text:'2. DHCP service: “Here are available settings.”',onStart:()=>{l.dhcp=2;renderBench()}},{routes:[['p1','sw','rt']],text:'3. Client: “I would like to use that offer.”',onStart:()=>{l.dhcp=3;renderBench()}},{routes:[['rt','sw','p1']],text:'4. Confirm PC 2’s settings. It receives 192.168.10.101. PC 1 and PC 3 already received their own settings.',ms:1700,onStart:()=>{l.dhcp=4;l.mode='dhcp';l.ips=[NET+'100',NET+'101',NET+'102'];l.gateway=[GATE,GATE,GATE];l.dns=[DNS,DNS,DNS];l.mask=MASK;drawNetwork();renderBench();save()}}],'PC 2 received its own DHCP settings. Each PC requests settings separately; the provider connection was not needed.');say('Watch the local request and reply. DHCP supplies configuration; it does not replace the network connection.');}
function lookup(){let l=lab();let r=test(l,1,DNS);if(!r.ok)return say(r.msg,true);journey([{routes:[['p1','sw','rt','md','net','dns']],text:'PC 2 asks the DNS server: “What is the address for '+HOST+'?”',ms:1900},{routes:[['dns','net','md','rt','sw','p1']],text:'DNS replies: “'+HOST+' has address '+GAME+'.”',ms:1900,onEnd:()=>{l.revealed=true;renderBench();save()}}],'Lookup complete. Now choose “Contact the game server” for a separate journey.');say('The DNS server supplies an address. Watch the lookup return before starting the game connection.');}
function nameTestPrior(){const l=lab(),r=test(l,1,HOST);if(!r.ok)return runTest(HOST);journey([{routes:[['p1','sw','rt','md','net','dns']],text:'Name test: first ask DNS for '+HOST+'.'},{routes:[['dns','net','md','rt','sw','p1']],text:'DNS returns '+GAME+'.'},{routes:[['p1','sw','rt','md','net','game']],text:'Now send the test request to the game server.'},{routes:[['game','net','md','rt','sw','p1']],text:'The game server replies.'}],'Name lookup and the connection test both succeeded.');l.output='PC 2> ping '+HOST+'\nResolved '+HOST+' ['+GAME+']\n'+r.msg;save();renderBench();say('The number and name tests now both work. DNS repaired the missing lookup step.');}
function challengeHTML(){let l=lab();return'<h3>PC 2 · one-fault support ticket</h3><div class="row"><button id="inspect2">Inspect PC 2</button><button id="hint">Hint'+(l.hints?' ('+l.hints+')':'')+'</button><button id="newTicket">New ticket</button></div><details id="repairPanel"><summary style="cursor:pointer;margin-top:12px">Open PC 2 repair controls</summary><label class="field"><input id="repairCable" type="checkbox" '+(l.links[1]?'checked':'')+'>Ethernet cable connected</label><div class="grid"><label class="field">IPv4 address<input id="repairAddress" value="'+esc(l.ips[1])+'" spellcheck="false"></label><label class="field">Default gateway<input id="repairGateway" value="'+esc(l.gateway[1])+'" spellcheck="false"></label><label class="field">DNS server<input id="repairDNS" value="'+esc(l.dns[1])+'" spellcheck="false"></label></div><button id="applyRepair" class="primary">Apply repair</button></details>'+buttons([['testLocal','Test local PC 1'],['testOutside','Test outside IP'],['testName','Test game name']])+'<p class="small" style="margin-top:10px">Current verification: '+['local','remote','name'].map(k=>(l.tests[k]?'✓':'○')+' '+k).join(' · ')+'</p>'+terminalHTML()+buttons([['verify','Verify repair','accent']])+(l.verified?'<p class="achievement" style="margin-top:12px">✓ Café connection verified</p><p>Explain: what caused the problem, what did we change, and which results support the repair?</p>':'')}
function bindChallenge(){on('inspect2',()=>inspect('p1'));on('hint',()=>{let l=lab();l.hints++;const clues={cable:'Inspect PC 2’s physical link. Is its cable connected?',address:'Compare PC 2’s address with the other PCs. Is any address repeated?',gateway:'A local test can pass without a gateway. Compare the outside test, then inspect PC 2’s exit setting.',dns:'Compare a successful outside-IP test with the name test. Check the DNS setting.'};say(clues[l.fault]);save()});on('newTicket',()=>{let order=['gateway','dns','cable','address'],i=(order.indexOf(lab().fault)+1)%order.length;state.labs[state.step]=base();let l=lab();l.fault=order[i];if(l.fault==='gateway')l.gateway[1]='';if(l.fault==='dns')l.dns[1]='';if(l.fault==='cable')l.links[1]=false;if(l.fault==='address')l.ips[1]=l.ips[2];render();say('New one-fault ticket ready. Ask the class which evidence to inspect first.');});on('applyRepair',()=>{let values={link:$('repairCable').checked,ip:$('repairAddress').value.trim(),gw:$('repairGateway').value.trim(),dns:$('repairDNS').value.trim()};mutate(l=>{l.links[1]=values.link;l.ips[1]=values.ip;l.gateway[1]=values.gw;l.dns[1]=values.dns},'Repair applied. Previous verification cleared; test all three journeys on these settings.');});on('verify',()=>{let l=lab();if(!['local','remote','name'].every(k=>l.tests[k]))return say('Run successful local, outside-IP, and name tests on the current settings before verifying.',true);l.verified=true;save();renderBench();say('All three tests passed. Ask a student to explain the cause, repair, and evidence.');});}

function referenceContentRev4(){return`<h1>Packet Café · Network Settings Reference</h1><p>A plan to use during our workshop and your independent café activity.</p><table><tr><th>Item</th><th>Our café plan</th><th>Job / reminder</th></tr><tr><td>Manual IPv4 addresses</td><td><code>PC 1: ${NET}11<br>PC 2: ${NET}12<br>PC 3: ${NET}13</code></td><td>Each NIC needs its own IP address on this LAN.</td></tr><tr><td>Subnet mask</td><td><code>${MASK}</code> (also /24)</td><td>With this mask, the first three number groups are the network section. This rule does not apply to every mask.</td></tr><tr><td>Default gateway</td><td><code>${GATE}</code></td><td>Our router’s LAN address; used to reach other networks.</td></tr><tr><td>DNS server</td><td><code>${DNS}</code></td><td>Looks up information such as an IP address for a name.</td></tr><tr><td>Game server</td><td><code>${HOST}<br>${GAME}</code></td><td>Provides the game service, separately from DNS.</td></tr><tr><td>DHCP</td><td><code>${NET}100–102</code> in our demo</td><td>Router service automatically supplies IP, mask, gateway and DNS settings. Local DHCP can work without internet.</td></tr></table><h2>Two address types</h2><p><strong>MAC:</strong> identifies an Ethernet NIC or Wi-Fi adapter for local delivery. Example: <code>${MAC[0]}</code>. A switch reads a frame’s source MAC and remembers its incoming port. It then uses the destination MAC to forward the frame.<br><strong>IP:</strong> identifies a connection within an IP network. It can change when the NIC joins another network. Example: <code>${NET}11</code>.</p><h2>What the tools do</h2><p><strong>Command:</strong> a typed instruction. <strong>Terminal:</strong> the window where you type it. <strong>ipconfig:</strong> reads the PC’s settings. <strong>ping:</strong> sends a small test request and waits for a reply. <strong>Reply from:</strong> a reply returned. <strong>Request timed out:</strong> no reply arrived in time.</p><h2>Read → test → repair → verify</h2><p>Inspect the cable and link light. Read the IP address and mask. Test a local PC. Check the gateway and test an outside IP. Compare a name test with the IP test. Change one thing and test again.</p><table><tr><th>Command on our simulated PC 2</th><th>Purpose</th></tr><tr><td><code>ipconfig</code></td><td>Display IPv4 address, mask and gateway.</td></tr><tr><td><code>ipconfig /all</code></td><td>Also display MAC, DHCP and DNS information.</td></tr><tr><td><code>ping ${NET}11</code></td><td>Test local PC 1.</td></tr><tr><td><code>ping ${GAME}</code></td><td>Test the game server by IP.</td></tr><tr><td><code>ping ${HOST}</code></td><td>Look up the name, then test the returned address.</td></tr></table><p><strong>Wiring:</strong> PCs → switch → router LAN. Router WAN → modem → provider service.</p><p class="small">A reply supports reachability for that test; it does not prove every application works. Real firewalls may block ping. This is a simulation: commands and addresses never access or change the school network.</p>`}
function referenceRev4(){modal('Keep this beside your café',referenceContent()+'<button id="printRef" class="printbtn">Print / save reference</button><details style="margin-top:18px"><summary>Optional: how does a PC discover a local MAC address?</summary><p>For IPv4 over Ethernet, ARP asks which MAC address belongs to a local IP address. A PC reaching an outside destination finds the gateway’s MAC for the local Ethernet step. The router then forwards onward. The switch-learning scene assumes this address lookup is already complete so we can focus on the switch.</p></details>');on('printRef',()=>printContent(referenceContent()))}
function guideContentRev4(){return'<h1>Network Control Room · Teacher Guide</h1><p><strong>About 54 minutes · projected class instruction · '+lesson.length+' scenes</strong></p><p>Continue after Before the Doors Open. Students first learn each definition, predict with a hands-up vote, and watch or operate the workbench. Use the Next button or arrow keys at your pace. Correct predictions are useful discussion, not gates. Wrong choices provide hints for another vote. Each scene is a separate prepared example; scene settings do not carry into the next scene.</p><p><strong>Controls:</strong> click devices to inspect; use the workbench to change values. Choose Step-by-step or Continuous play for any journey. In Step-by-step mode, the demonstration starts its first segment and waits for Next step before each remaining segment. Pause freezes a moving segment; Replay journey repeats the example. Reset scene restores only the current example. Notes are visible on the projector. Full screen uses the browser’s supported full-screen mode. No student account or submission is required.</p><p><strong>Teaching target:</strong> explain the purposes of settings, inspect them, compare tests, make a repair, and verify it with a reference available. Do not require address memorization or subnet calculations.</p>'+lesson.map((m,i)=>'<section><h2>'+String(i+1).padStart(2,'0')+'. '+m.title+' · '+m.time+' min</h2><p><strong>'+m.term+':</strong> '+m.def+'</p><p>'+m.note+'</p><p><strong>Class check:</strong> '+m.q+'<br><strong>Answer:</strong> '+m.options[m.answer]+'<br>'+m.why+'</p></section>').join('')+'<section><h2>Transition to independent Packet Café</h2><p>The existing independent activity uses the same manual addresses .11–.13, DHCP .100–.102, gateway '+GATE+', DNS '+DNS+', and game server '+GAME+'. It already includes NICs, client/host, link lights, star topology, LAN/WAN ports, gateway, DNS, and evidence-based repairs. Its subnet-mask and command missions remain optional. The bridge adds MAC and switch-learning demonstrations and supported command practice; these do not require changing the independent game’s completion rules.</p></section><section><h2>Model limits</h2><p>All equipment is powered on. Our router provides local DHCP and has an ISP-configured WAN connection. Firewall rules and address translation are ready. This is a separate cable modem/router/switch example; real equipment may combine roles. Basic MAC learning starts with two PCs. Unknown-destination copies appear only in an optional three-PC demonstration. The PCs already know the relevant destination MAC there; ARP is optional reference context. MAC addresses are fixed examples, not guaranteed immutable identifiers. Address conflict failure is simplified; real conflicts can be intermittent. DNS caching, multiple DNS servers, route tables, packet encapsulation, timings and real game protocols are omitted. The animation represents simplified message journeys. The provider cloud represents many routers and connections. Documentation addresses and arena.example are fictional. There are no real network requests, commands, DNS lookups, or game connections.</p><p><strong>Optional address note:</strong> for our /24, '+NET+'0 identifies the subnet and '+NET+'255 is its broadcast address. Do not assign either to a PC. Binary math and subnet calculations are deferred.</p><p>Class progress saves locally when browser storage is available. Scene labs can be reset independently. Local records are not individual assessment or tamper-proof evidence. Browser storage can be cleared by school policy.</p></section><section><h2>Technical references</h2><p><a href="https://www.cisco.com/c/en/us/support/docs/lan-switching/ethernet/12006-chapter22.html">Cisco: LAN switching and address learning</a><br><a href="https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/ipconfig">Microsoft: ipconfig</a><br><a href="https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/ping">Microsoft: ping</a></p></section>'}
function guide(){modal('Teach from the control room','<p><strong>One class period, fully teacher-led.</strong> Use a reference rather than requiring memorization. Each scene introduces one idea before students use it. The Console button is available in every scene. Choose a PC, use clickable command examples or help, and open Why? after a failed test. The sequence defines ping, shows a request/reply demonstration, introduces command-window basics, reads ipconfig, and only then builds a ping command. Gateway, DNS and DHCP each have an introduction before their practical demonstration. A worked repair precedes the final challenge.</p>'+buttons([['printGuide','Print / save full teacher guide']])+guideContent());on('printGuide',()=>printContent(guideContent()))}

function syncJourneyBeforeARP(){let mode=state.playback||'step';$('playback').value=mode;$('advanceJourney').disabled=!motion||!motion.waiting;$('advanceJourney').textContent=motion&&motion.waiting?'Next step '+(motion.index+2)+' / '+motion.segments.length:'Next message step';$('pause').disabled=!motion||motion.waiting;$('pause').textContent=paused?'Resume':'Pause';if($('quickNext')){$('quickNext').disabled=$('advanceJourney').disabled;$('quickNext').textContent=$('advanceJourney').textContent}}

function journeyLessonCore(segments,ending){stop();headerPlaceholder(segments.some(s=>(s.routes||[]).some(r=>r.includes('sw')))?'The local Ethernet header appears when a frame reaches the switch.':'No frame reaches the switch in this demonstration.');epoch++;lastJourney={segments,ending};motion={segments,ending,index:-1,waiting:false,start:null,id:epoch};advanceSegment()}
function advanceSegment(){if(!motion)return;let m=motion;m.index++;m.waiting=false;m.start=null;paused=false;if(m.index>=m.segments.length){setCaption(m.ending);motion=null;syncJourney();save();return}let seg=m.segments[m.index];if(seg.routes&&seg.routes.some(r=>r.includes('sw')))headerPlaceholder();setCaption((m.index+1)+' / '+m.segments.length+' · '+seg.text.replace(/^\d+\.\s*/, ''));if(seg.onStart)seg.onStart();syncJourney();let id=m.id;const tick=now=>{if(!motion||motion.id!==id)return;if(paused){raf=requestAnimationFrame(tick);return}if(m.start===null)m.start=now;let p=Math.min(1,(now-m.start)/(seg.ms||1700));drawDots(seg.routes||[],p);if(seg.onFrame)seg.onFrame(p);if(p===1){if(seg.onEnd)seg.onEnd();if(m.index===m.segments.length-1){setCaption(m.ending);motion=null;syncJourney();save();return}if((state.playback||'step')==='step'){m.waiting=true;setCaption((m.index+1)+' / '+m.segments.length+' · '+seg.text.replace(/^\d+\.\s*/, '')+' — Choose Next message step.');syncJourney();return}advanceSegment();return}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}

function pingResult(l,n,target){
 const dest=target.toLowerCase(),name=dest===HOST;
 const fail=(output,why)=>({ok:false,output,why,target,kind:'ping'});
 if(!target)return fail('Ping needs a destination.','Type ping, one space, and a destination such as '+NET+'11. The examples fill the command box for you.');
 if(dest===l.ips[n]&&localIP(l.ips[n])&&l.mask===MASK&&l.ips.filter(x=>x===l.ips[n]).length===1)return{ok:true,kind:'ping',target,output:'Reply from '+dest+': bytes=32 time<1ms\nSent = 2, Received = 2, Lost = 0\nLocal self-test: this does not check the cable or internet.',why:'',self:true};
 if(!l.links[n])return fail('Media disconnected.','The Ethernet cable for '+pcName(n)+' is disconnected. Reconnect that PC’s cable before testing another device.');
 if(!localIP(l.ips[n]))return fail('No usable IP address on '+pcName(n)+'.',pcName(n)+' does not have a usable address in this prepared café network. Inspect its IP setting or complete this scene’s configuration task.');
 if(l.mask!==MASK)return fail('Request timed out.','The subnet mask does not match our supplied plan, '+MASK+'.');

nt===2?'ARP FIRST · THEN GAME DATA':'PC 3 ASKS · PC 2 ANSWERS'}

{routes:[],text:'1. '+pcName(a)+' knows '+pcName(b)+'’s IP from the plan. The mask says it is local. Its saved ARP list has no MAC match.',onStart:()=>arpUpdate('Need a local MAC before addressing the game frame.','need')},
{routes:[['p'+a,'in'+a,'sw']],macFrame:request,text:'2. '+pcName(a)+' sends an ARP question: “Who has '+l.ips[b]+'?” The frame has a broadcast destination MAC.',onStart:()=>{l.frameSender=a;l.frameReceiver=b;arpUpdate('ARP question: '+l.ips[b]+' belongs to which MAC?','request')},onEnd:()=>{l.table[MAC[a]]=a+1;arpUpdate('Switch learned '+pcName(a)+'’s SOURCE MAC on port '+(a+1)+'.','learnSource')}},
{routes:others.map(n=>['sw','in'+n,'p'+n]),macFrame:request,text:'3. Broadcast: the switch copies the question to its other connected ports. '+(third?'PC 1 has a different IP and does not answer. ':'')+pcName(b)+' recognizes its own IP.',onEnd:()=>{l.arpCaches[b][l.ips[a]]=MAC[a];arpUpdate(pcName(b)+' owns '+l.ips[b]+' and can answer.','heard')}},
{routes:[['p'+b,'in'+b,'sw']],macFrame:reply,text:'4. '+pcName(b)+' replies with its MAC. The switch reads the reply’s SOURCE MAC as it arrives on port '+(b+1)+'.',onStart:()=>{l.frameSender=b;l.frameReceiver=a;arpUpdate(pcName(b)+' replies: “Here is my MAC.”','reply')},onEnd:()=>{l.table[MAC[b]]=b+1;arpUpdate('Switch now knows '+pcName(b)+' is reached through port '+(b+1)+'.','learnReply')}},
{routes:[['sw','in'+a,'p'+a]],macFrame:reply,text:'5. The reply is addressed to '+pcName(a)+'’s MAC. The switch already learned its port. '+pcName(a)+' receives the answer and saves the IP-to-MAC match.',onEnd:()=>{l.arpCaches[a][l.ips[b]]=MAC[b];arpUpdate(pcName(a)+' now knows '+l.ips[b]+' → '+MAC[b]+'.','saved')}},
{routes:[['p'+a,'in'+a,'sw']],macFrame:game,text:'6. NOW '+pcName(a)+' sends the game frame. It uses the destination MAC it just learned from ARP.',onStart:()=>{l.frameSender=a;l.frameReceiver=b;arpUpdate('Game frame uses the saved destination MAC.','game')}},
{routes:[],macFrame:game,text:'7. The switch reads the game frame’s destination MAC, finds it in its own list, and selects port '+(b+1)+'.',onStart:()=>showEthernetHeader(game)},
{routes:[['sw','in'+b,'p'+b]],macFrame:game,text:'8. The switch forwards the game frame through port '+(b+1)+' to '+pcName(b)+'.',onEnd:()=>arpUpdate('Game message delivered to '+pcName(b)+'.','delivered')},
{routes:[['p'+b,'in'+b,'sw','in'+a,'p'+a]],macFrame:answer,text:'9. '+pcName(b)+' sends a game reply. The switch uses its learned list to return it to '+pcName(a)+'.',onStart:()=>{l.frameSender=b;l.frameReceiver=a;arpUpdate('The game reply uses the learned return port.','gameReply')},onEnd:()=>{l.exchangeComplete=true;arpUpdate('Complete: ARP found the MAC; the switch learned ports; game data and a reply were delivered.','complete')}}
],'ARP discovery and switch learning happened together. The game frame then used BOTH saved lists.');lastJourney.replay=()=>learn(a,b);}
function unknownCopies(){let l=lab();arpFresh(true);l.optional=true;l.arpSender=0;l.arpReceiver=2;l.arpCaches[0][l.ips[2]]=MAC[2];l.table={};drawNetwork();renderBench();let f={sourceMAC:MAC[0],destinationMAC:MAC[2],kind:'Game frame · unknown switch port',note:'PC 1 has the destination MAC already; only the switch’s port list was cleared.'};journey([{routes:[['p0','in0','sw']],macFrame:f,text:'The PC’s saved ARP match remains. Its frame names ONLY PC 3’s MAC.',onEnd:()=>{l.table[MAC[0]]=1;arpUpdate('Switch learned PC 1, but has no port entry for PC 3.','optional')}},{routes:[['sw','in1','p1'],['sw','in2','p2']],macFrame:f,text:'The switch copies the unknown-destination frame out its other connected ports. PC 2 rejects it because the destination MAC is not its own. PC 3 accepts it.'},{routes:[['p2','in2','sw','in0','p0']],macFrame:{sourceMAC:MAC[2],destinationMAC:MAC[0],kind:'Reply'},text:'PC 3’s reply supplies source-MAC evidence. The switch learns port 3.',onEnd:()=>{l.table[MAC[2]]=3;arpUpdate('The switch can now send later PC 3 frames directly to port 3.','complete')}}],'ARP broadcast asks everyone a question. Unknown-unicast flooding copies a frame addressed to ONE MAC because its switch port is not yet known.');lastJourney.replay=unknownCopies;}
function showEthernetHeader(frame){let el=$('ethernetHeader');if(!el||!headerEnabled()||!frame)return;lab().headerMemory=frame;let format=mac=>MAC.includes(mac)?macTag(MAC.indexOf(mac)):'<code class="maclabel" style="color:'+(mac===ALL_MAC?'#c3b0ff':'#9bceff')+'">'+mac+'</code>';el.hidden=false;el.innerHTML='<div class="headerTitle">'+esc(frame.kind||'ETHERNET FRAME')+' · AT THE CAFÉ SWITCH</div><div class="headerFields"><div><span>Source MAC · '+esc(macOwner(frame.sourceMAC))+'</span>'+format(frame.sourceMAC)+'</div><div class="destinationMAC"><span>Destination MAC · '+esc(macOwner(frame.destinationMAC))+'</span>'+format(frame.destinationMAC)+'</div></div><p>'+esc(frame.note||(frame.destinationMAC===ALL_MAC?'Broadcast: copy to the other local ports.':'The switch looks up the destination MAC to choose its outgoing port.'))+'</p>'}
function dhcpAssign(){let l=lab(),client={sourceMAC:MAC[1],destinationMAC:ALL_MAC,kind:'DHCP client broadcast',note:'PC 2 can ask locally before it has an assigned IP. The other café ports receive copies too.'},server={sourceMAC:ROUTER_MAC,destinationMAC:ALL_MAC,kind:'DHCP service reply',note:'This model uses a local broadcast reply. Only the requesting PC accepts this offer for its request.'};let ask=[['p1','sw','rt'],['p1','sw','p0'],['p1','sw','p2']],back=[['rt','sw','p1'],['rt','sw','p0'],['rt','sw','p2']];l.ips[1]='';l.mode='manual';l.dhcp=0;resetConsoleEvidence();drawNetwork();renderBench();journey([{routes:ask,macFrame:client,text:'1. ASK: PC 2 has no assigned IP. It broadcasts a request for settings on the café LAN.',onStart:()=>{l.dhcp=1;renderBench()}},{routes:back,macFrame:server,text:'2. OFFER: the router’s DHCP service offers the unused address 192.168.10.101 and the other settings.',onStart:()=>{l.dhcp=2;renderBench()}},{routes:ask,macFrame:client,text:'3. ACCEPT: PC 2 requests that offered set of settings. Its Ethernet NIC still uses the same MAC.',onStart:()=>{l.dhcp=3;renderBench()}},{routes:back,macFrame:server,text:'4. CONFIRM: the DHCP service confirms the lease. PC 2 applies the settings when the confirmation arrives.',onStart:()=>{l.dhcp=3;renderBench()},onEnd:()=>{l.dhcp=4;l.mode='dhcp';l.ips=[NET+'100',NET+'101',NET+'102'];l.gateway=[GATE,GATE,GATE];l.dns=[DNS,DNS,DNS];l.mask=MASK;resetConsoleEvidence();drawNetwork();renderBench();save()}}],'PC 2 now has its own IP, mask, gateway and DNS. Local DHCP worked without provider service.');lastJourney.replay=dhcpAssign;}
function reviewBench(){return '<h3>Check the physical connection</h3><p>Hardware means physical equipment. Software means programs. Here we only reconnect a cable; we will explain message delivery before testing it.</p>'+buttons([['reviewConnect',lab().links[1]?'Disconnect PC 2':'Connect PC 2','primary']])+statusHTML()}
const wordBank={
'protocol':'A set of shared rules devices follow to communicate. ARP, IP, and DHCP are names of protocols with different jobs.',
'LAN':'Local Area Network: connected devices in a nearby place, such as our café. Local communication can work without internet service.',
'WAN':'Wide Area Network: a network extending across a wider area. Providers use routers and links to connect customer networks. The internet connects many networks.',
'NIC':'Network Interface Card: hardware that connects a computer to an Ethernet network. It may be built into the computer. A Wi-Fi adapter is hardware for a wireless connection.',
'interface':'A network connection point. Here we name the hardware more specifically: Ethernet NIC or Wi-Fi adapter.',
'port':'In this lesson, a physical socket for a cable plug. Switch port 1 is the physical socket connected to PC 1. Software port numbers are a different idea.',
'MAC':'Media Access Control address: an adapter’s identification address for local delivery. Example: '+MAC[0]+'. Six character pairs; keep the full label. One computer can have multiple adapters and different MACs.',
'IP':'Internet Protocol address: a number assigned to a network connection. Our IPv4 examples have four groups separated by dots. Example: '+NET+'11. Use a unique address that fits the local network.',
'subnet mask':'A separate setting that marks the network part of an IP address. The FULL value here is '+MASK+'. With this value, the first three IP groups are the network part. Other masks can divide the address differently.',
'data':'Information, such as a game move, a photo, or a typed message.',
'source':'The sender or starting point of THIS message. When a reply travels back, the source changes.',
'destination':'Where THIS message is intended to go. A packet has an IP destination; an Ethernet frame has a MAC destination for its local step.',
'packet':'A bundle of data with IP-address labels. It can be carried inside an Ethernet frame for a local Ethernet step.',
'frame':'An Ethernet bundle with MAC labels in its header. It can carry an IP packet or another kind of information, such as an ARP question.',
'header':'Labels included with a bundle of information. These are not words a player types into game chat.',
'ARP':'Address Resolution Protocol: asks which MAC belongs to a local IPv4 address on this Ethernet LAN. A PC checks saved matches first, then asks locally when it needs a match.',
'broadcast':'A message addressed to all local NICs. Its Ethernet destination MAC is FF:FF:FF:FF:FF:FF. The switch copies it to the other connected ports. A router normally does not forward this local ARP broadcast to other networks.',
'cache':'Saved information kept for reuse. A PC ARP cache holds IP-to-MAC matches. A DNS cache can hold name-to-IP matches. A switch MAC table holds MAC-to-port matches.',
'switch':'Connects local Ethernet devices. It learns source MAC → incoming port, then uses the destination MAC to choose an outgoing port. It does not assign IPs or MACs.',
'router':'Forwards IP packets between networks. On its café Ethernet step it has its own MAC and local IP. Its next network connection uses a new frame for that next step.',
'default gateway':'The PC setting naming its usual local router for other networks. Use '+GATE+' in our café, not the outside game server’s IP.',
'modem':'Equipment connecting this example to the provider’s cable service. A modem and router may be combined in one home box.',
'ISP':'Internet Service Provider: the company providing the outside network connection. Its routers and links are summarized by the provider cloud in our drawing.',
'server':'A computer or program providing a service. Our game server runs the game; our separate DNS server provides name lookups.',
'client':'A computer or program asking for a service. PC 2 is a DHCP client when it asks for settings.',
'DNS':'Domain Name System: looks up information such as an IP for a name. The DNS setting '+DNS+' tells our PC who to ask; the answer for '+HOST+' is the game server IP '+GAME+'.',
'DHCP':'Dynamic Host Configuration Protocol: a service that supplies settings automatically. A client can broadcast before receiving its normal IP. Our local router provides the service.',
'lease':'Permission to use an assigned IP address for a limited time. A DHCP client can renew its lease.',
'command':'An instruction typed into a command window. Type after the prompt, then Run or Enter. The prompt itself is not part of your command.',
'prompt':'The printed starting label, such as PC 2>. It identifies the simulated PC receiving your instruction.',
'ipconfig':'A Windows command that reads IP settings. It does not test another device or repair settings. /all adds details, including the MAC (called Physical address in Windows), DHCP and DNS.',
'ping':'Sends a small test request and waits for a reply. A reply supports reachability for that test, not proof that every application works. A missing reply alone does not identify the cause.',
'output':'Text printed by a command. Reply from means a reply returned. Request timed out means no reply arrived before waiting ended. Media disconnected means no physical Ethernet link.',
'verify':'Repeat a test after a change to check whether the repair worked. Use the same destination to compare before and after.',
'Wi-Fi':'A wireless way to connect to a local network using radio. Wi-Fi is not the internet. Nearby devices on that LAN can communicate while outside service is unavailable.'};

function renderBenchBeforeARP(){const t=lesson[state.step].type;if(extraTypes.includes(t)){$('bench').innerHTML=conceptBench();on('runGatewayARP',gatewayARPDemo);on('nextConcept',()=>{lab().gatewayARPstarted=false;lab().cardStep=(lab().cardStep||0)>=2?0:(lab().cardStep||0)+1;drawNetwork();renderBench();save()})}else if(t==='review'){$('bench').innerHTML=reviewBench();on('reviewConnect',()=>mutate(l=>l.links[1]=!l.links[1],'Physical connection changed. Notice the cable and link indication.'))}else if(t==='switch'||t==='switch3'){$('bench').innerHTML=arpBench()+statusHTML();on('startARP',()=>learn(t==='switch'?0:2,1));on('resetARP',()=>{stop();arpFresh(t==='switch3');drawNetwork();renderBench();headerPlaceholder();setCaption('Fresh starting setup restored. Start the ARP question.');save()});on('optionalCopies',unknownCopies)}else if(t==='mask'){$('bench').innerHTML=maskBench();on('changePair',()=>{stop();lab().compareDifferent=!lab().compareDifferent;drawNetwork();renderBench();setCaption(lab().compareDifferent?'Only the destination changed. The network parts no longer match.':'The network parts match. These addresses are local with this mask.');save()})}else if(t==='ready'){$('bench').innerHTML=endingBench();bindEnding()}else renderBenchLegacy();if(t==='dhcp')$('bench').insertAdjacentHTML('afterbegin','<p class="beginnerHint"><strong>No IP yet?</strong> PC 2 can still send a local Ethernet broadcast using its MAC label. The router’s prepared DHCP service hears it. A broadcast also reaches the other local ports; the bright path follows the service that answers.</p>');if(t==='dns')$('bench').insertAdjacentHTML('beforeend','<div class="gatewayCache"><strong>PC 2 saved name lookup:</strong> '+(lab().revealed?HOST+' → '+GAME:'No answer received yet')+'</div>');if($('terminal'))$('terminal').innerHTML=colored(consoleRecord().output);bindConsole('inline');}
function referenceContentBeforeARP(){return '<h1>Packet Café · Beginner Reference · Revision 8</h1><p>Use the plan, not guesses. All outside addresses and the game name are fictional simulation examples.</p><table><tr><th>Setting</th><th>Our value</th><th>Job</th></tr><tr><td>PC IPs · manual</td><td>'+NET+'11 / '+NET+'12 / '+NET+'13</td><td>Unique local IP for each PC</td></tr><tr><td>Full subnet mask</td><td>'+MASK+'</td><td>First three IP groups are the network part with this mask; 254 usable device addresses, including the router</td></tr><tr><td>Default gateway</td><td>'+GATE+'</td><td>Local router to other networks</td></tr><tr><td>DNS server</td><td>'+DNS+'</td><td>Who to ask for a name lookup</td></tr><tr><td>Game server</td><td>'+HOST+' → '+GAME+'</td><td>Outside destination running the game</td></tr><tr><td>DHCP example</td><td>'+NET+'100 / .101 / .102</td><td>Automatic settings; three different full IPs</td></tr></table><h2>The steps before a first local game message</h2><ol><li>Use the destination IP from our plan.</li><li>Use the mask to decide it is local.</li><li>Check the PC’s saved ARP matches; ask ARP if the MAC is missing.</li><li>The ARP request teaches the switch the sender’s source MAC and incoming port.</li><li>The destination’s ARP reply teaches its source MAC and port, and gives the requesting PC its IP-to-MAC match.</li><li>The game frame uses the saved destination MAC. The switch looks up that MAC’s port.</li></ol>'+snapshotLists()+'<h2>For an outside destination</h2><p>The packet names the outside server’s IP. The first local Ethernet frame names the local router’s MAC. The PC can find that MAC with ARP for '+GATE+'. The router forwards using a new frame for its next connection. The modem/provider connection is already supplied in this lesson.</p><h2>Commands</h2><p>Select a PC. Type after the prompt. Examples fill the box; Run or Enter executes.</p><table><tr><th>Command</th><th>Purpose</th></tr><tr><td>help</td><td>List supported commands and destinations</td></tr><tr><td>ipconfig</td><td>Read IP, mask and gateway</td></tr><tr><td>ipconfig /all</td><td>Also show MAC, DHCP and DNS</td></tr><tr><td>ping '+NET+'11</td><td>Test local PC 1</td></tr><tr><td>ping '+GATE+'</td><td>Test local router</td></tr><tr><td>ping '+GAME+'</td><td>Test outside game IP without DNS lookup</td></tr><tr><td>ping '+HOST+'</td><td>Look up the name, then test its returned IP</td></tr></table><p>Reply from = reply returned. Request timed out = no reply in time. Media disconnected = no cable link. A result is evidence, not an automatic diagnosis. Change one thing, Apply, and repeat tests to verify.</p><h2>Word bank</h2>'+Object.entries(wordBank).map(([w,d])=>'<p><strong>'+esc(w)+':</strong> '+esc(d)+'</p>').join('')}
function reference(){modal('Keep this beside your café',referenceContent()+'<button id="printRef" class="printbtn">Print / save reference</button>');on('printRef',()=>printContent(referenceContent()))}
function guideContentBeforeARP(){return '<h1>Network Control Room · Revision 8 · Teacher Guide</h1><p>'+lesson.length+' short scenes · about '+lesson.reduce((n,m)=>n+m.time,0)+' minutes at the planned pace, with optional material deferred. You can slow down or continue next lesson if the class needs it.</p><p>Vocabulary comes before tasks. Read the definition, demonstrate, then use one class vote. Word chips and the word bank explain unfamiliar language. No address memorization, binary arithmetic, pointing exercises, or speech scoring.</p><h2>How examples connect</h2><p>The ARP sequence explicitly shows destination discovery before game data. The PC saves IP → MAC; the switch saves MAC → incoming port. The reply teaches the switch during ARP, so both switch entries exist before the later game frame. The third-PC scene is a prepared continuation labeled as such. Other tasks reset to separately labeled practice setups; current-scene values drive the console.</p><h2>Controls</h2><p>Journey mode: Step-by-step waits at the end of each message step; Continuous play advances automatically. Pause freezes movement. Replay restarts the demonstration. Console: choose PC 1/2/3; help, ipconfig, ipconfig /all and ping work in every scene. Examples fill the input. Why? expands a failed test explanation. The final PC 2 ticket requires current PC 2 test evidence. Reset scene affects only that example. Student progress and question attempts cannot be cleared through the lesson controls. Notes are visible to the projector.</p>'+lesson.map((m,i)=>'<section><h2>'+String(i+1).padStart(2,'0')+'. '+m.title+' · '+m.time+' min</h2><p><strong>'+m.term+':</strong> '+m.def+'</p><p><strong>Setup:</strong> '+m.setup+'</p><p>'+m.note+'</p><p><strong>Check:</strong> '+m.q+'<br><strong>Answer:</strong> '+m.options[m.answer]+'<br>'+m.why+'</p></section>').join('')+'<h2>Scope and simplifications</h2><p>This is a conceptual Ethernet/IPv4 model. A local cable carries physical signals that represent the bundles shown by dots. It makes no real network requests or Chromebook changes. The fictional IPs and name are for documentation. ARP is taught as local discovery; routers do not forward that local broadcast between networks. DNS name lookup is separate from local MAC lookup. Provider routing, its addressing, address translation, and firewall permissions are prepared; they are not configured by students here. For the internet example a home router may also translate private IPs; that extra operation is outside this beginner lesson. Local MAC frames are replaced at routed connections, not carried unchanged across the internet. MAC labels are fixed examples, not immutable identities. DHCP offers/confirmation are drawn as broadcasts; actual implementations may use unicast. An offer is not applied as an address until the final confirmation arrives. Real ping can be filtered and duplicate-IP symptoms can vary. The independent Packet Café remains a separate activity; this bridge supplies the explanations needed for it.</p><h2>Primary references</h2><p><a href="https://www.rfc-editor.org/rfc/rfc826">RFC 826 · ARP</a><br><a href="https://www.rfc-editor.org/rfc/rfc2131">RFC 2131 · DHCP</a><br><a href="https://www.cisco.com/c/en/us/support/docs/lan-switching/ethernet/12006-chapter22.html">Cisco · Ethernet switching</a><br><a href="https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/ipconfig">Microsoft · ipconfig</a><br><a href="https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/ping">Microsoft · ping</a></p>'}
function gatewayARPDemo(){let l=lab();l.gatewayARPstarted=true;l.gatewayARPLearned=false;l.table={};drawNetwork();renderBench();let req={sourceMAC:MAC[1],destinationMAC:ALL_MAC,kind:'ARP for the local gateway',note:'Who has '+GATE+'? The requested IP is the router, not the outside server.'},rep={sourceMAC:ROUTER_MAC,destinationMAC:MAC[1],kind:'Router ARP reply',note:GATE+' uses '+ROUTER_MAC+'.'},game={sourceMAC:MAC[1],destinationMAC:ROUTER_MAC,kind:'First local frame toward the game',note:'Inside: IP destination '+GAME+'. Outside: destination MAC is the local router.'};journey([{routes:[['p1','sw']],macFrame:req,text:'1. PC 2’s mask says the game IP is outside. It knows its gateway IP from settings but needs the gateway MAC.',onEnd:()=>{l.table[MAC[1]]=2;renderBench()}},{routes:[['sw','p0'],['sw','rt']],macFrame:req,text:'2. The switch broadcasts “Who has 192.168.10.1?” locally. PC 1 has a different IP. The router recognizes its own local IP.'},{routes:[['rt','sw']],macFrame:rep,text:'3. The router replies with its café NIC’s MAC. The switch learns the router’s source MAC on its router-facing port.',onEnd:()=>{l.table[ROUTER_MAC]='router-facing';renderBench()}},{routes:[['sw','p1']],macFrame:rep,text:'4. PC 2 saves the gateway IP-to-MAC match from the reply.',onEnd:()=>{l.gatewayARPLearned=true;renderBench();save()}},{routes:[['p1','sw','rt']],macFrame:game,text:'5. PC 2 can now send a frame to the router’s MAC. The IP packet inside still names the game server as its destination.'},{routes:[['rt','game']],text:'6. The router forwards toward the outside server using new frames on the following network links. This line summarizes the provider path.'}],'First deliver locally to the gateway’s MAC. The router handles the next network step toward the destination IP.');lastJourney.replay=gatewayARPDemo;}

function studentHelpLessonCore(){
 modal('Your guide to the control room',`<p><strong>Work alone or with a partner.</strong> Follow the same lesson at your own pace. If sharing a Chromebook, take turns controlling it and explaining what happened at each new section.</p>
 <ol><li><strong>Read first.</strong> Read the explanation, then use the Do / Watch / Continue directions above each slide.</li><li><strong>Find the controls.</strong> Buttons and command boxes are beneath the diagram. Scroll down if you cannot see them. An outlined control shows where to start; you can still explore the others.</li><li><strong>Complete the reading check.</strong> Read the explanation above it. Choose one option, then click Check answer. You have two attempts. After two wrong answers, read the correct answer and acknowledge the explanation. The next slide unlocks after this check and the required activity.</li><li><strong>Follow moving messages.</strong> In Step-by-step mode, a journey waits between parts. The button changes from “Next message step” to “Next step” plus a number. Click it beneath the diagram to continue. Continuous play runs its parts automatically. Pause / Resume controls a moving message; Replay journey repeats it.</li><li><strong>ARP uses the bottom Next button.</strong> On the ARP slides, its label tells you which action comes next. Wait while the message moves. “Next slide” or “Next scene” means that demonstration is finished.</li><li><strong>Try commands when directed.</strong> Console is available on every slide. Choose PC 1, PC 2 or PC 3. Click an example to fill the command box, then click Run or press Enter. Type help for supported commands; use Why? after a failed test.</li><li><strong>Explore when ready.</strong> After the main action, replay it or try the other visible controls. Reset scene restores this slide if you want a fresh start. Each slide has its own prepared setup; your changes do not carry to the next slide.</li></ol>
 <details><summary>If you get stuck — open these tips</summary><ul><li><strong>Nothing moving?</strong> Look for “Next step,” Resume, or the bottom Next action. A read-only slide may simply ask you to read and continue.</li><li><strong>Cannot find a button?</strong> Scroll below the diagram. The bottom Next button usually changes slides; it does not run the workbench task.</li><li><strong>Unfamiliar word?</strong> Click a word beneath the explanation or open Word bank. Settings reference contains the address plan.</li><li><strong>Unexpected result?</strong> Read the feedback or Why? explanation. Check “Starting setup for this example.” Use Reset scene to restore the prepared example.</li></ul>
 </details><p>Your progress saves in this browser when storage is available. Use Back or the slide menu to revisit an example. Complete the five graded checkpoints, then save your final PDF report for Canvas. Save a progress file before leaving the lesson.</p><button id="startStudentLesson" class="primary">Got it — return to the lesson</button>`);
 on('startStudentLesson',()=>{$('modal').close();try{localStorage.setItem('packet-cafe-student-guide-v1','seen')}catch{}});
}
function studentStatus(){
 if(!motion)return '';
 if(paused)return 'The message is paused. Click Resume beneath the diagram to keep it moving.';
 if(motion.waiting)return 'This journey is waiting. Click “'+$('advanceJourney').textContent+'” beneath the diagram to continue the same demonstration.';
 return 'A message is moving. Follow the dots and read the caption beneath the diagram. Wait for this part to finish.';
}
function updateStudentDirections(){
 const m=lesson[state.step],d=studentDirections[m.type];if(!d)return;
 let status=studentStatus();
 if(!status&&arpStory()&&arpStorySteps()>0){status=storyPhase()>=arpStorySteps()?'This demonstration is finished. Click the bottom “Next slide” button to continue.':lesson[state.step].type==='switch'&&storyPhase()===1?'PC 1’s question has reached the switch. Click the bottom Next button to pass it to BOTH other PCs.':d[0];}
 if(!status&&lesson[state.step].type==='gatewayARP'&&(lab().simpleARPstep||0)>=3)status='This demonstration is finished. Click the bottom “Next scene” button to continue.';
 $('studentDirections').innerHTML='<div class="directionHeading"><strong>YOUR NEXT STEPS</strong><span>Slide '+(state.step+1)+' · Read → try → notice</span></div><div class="directionGrid"><div><h2>Do</h2><p>'+esc(status||d[0])+'</p></div><div><h2>Watch</h2><p>'+esc(d[1])+'</p></div><div><h2>Continue</h2><p>'+esc(d[2])+'</p></div></div>';
 document.querySelectorAll('[data-guided-start]').forEach(el=>el.removeAttribute('data-guided-start'));
 let id=motion?(motion.waiting?'advanceJourney':paused?'pause':null):d[3];
 if(arpAnimated()&&!motion)id='next';
 if(id&&$(id)&&!$(id).disabled)$(id).setAttribute('data-guided-start','true');
}
function renderStudentCore(){renderLesson();$('chapter').textContent=chapters[lesson[state.step].ch]+' / WORK SOLO OR TOGETHER';if($('predictToggle'))$('predictToggle').textContent='Make a prediction';updateStudentDirections()}
function renderBenchStudentCore(){renderLessonBench();updateStudentDirections()}
function syncStudentJourney(){syncLessonJourney();updateStudentDirections()}
$('studentHelp').onclick=studentHelp;
document.addEventListener('click',()=>setTimeout(updateStudentDirections,0));

 if($('next')){let final=state.step===35,ready=slideCompleted(state.step)&&!motion;$('next').disabled=!!motion||(!arpPending&&!ready);if(!motion&&!arpPending)$('next').textContent=!ready?(needQuestion?'Complete reading check ↓':'Finish slide activity ↓'):final?'View final report →':state.step===checkpoints[c].end?'Next section →':'Next slide →';$('next').onclick=final?()=>allGradedDone()?showReport():openCheckpoint(4):nextLesson}
 $('reportButton').disabled=!allGradedDone();$('saveProgress').disabled=!grade().names.length;
 document.querySelectorAll('#jump option').forEach((el,i)=>el.disabled=i>unlockedThrough());document.querySelectorAll('[data-chapter]').forEach(b=>{const n=lesson.findIndex(x=>x.ch===+b.dataset.chapter);b.disabled=n>unlockedThrough()});
 if(allGradedDone()&&!grade().completedAt){grade().completedAt=new Date().toISOString();saveLessonCore()}
}
function showIdentity(){modal('Who is working on this café?',`<p>Work alone or with one partner. Both partners receive the same score and appear on one report.</p><form id="identityForm"><label class="field">Student name<input id="studentName" maxlength="80" required autocomplete="off" value="${esc(grade().names[0]||'')}"></label><label class="field">Partner name (leave blank if working alone)<input id="partnerName" maxlength="80" autocomplete="off" value="${esc(grade().names[1]||'')}"></label><p>36 required slide questions and five practical checkpoints · 50 points. Each question has TWO attempts: first correct earns full credit, second correct earns half, two incorrect earn zero. After two mistakes, read and acknowledge the revealed answer. Questions together earn 25 points; practical work earns 25. Complete the question and required activity before leaving each slide.</p><p>At the end of class, use <strong>Save progress</strong> and keep the downloaded file in Google Drive. Next time, use <strong>Resume</strong> to select it.</p><button class="primary">Start / continue lesson</button><button type="button" id="identityResume">Resume a saved file instead</button></form>`);$('identityForm').onsubmit=e=>{e.preventDefault();const names=[$('studentName').value.trim(),$('partnerName').value.trim()].filter(Boolean);if(!names[0])return;grade().names=names;save();$('modal').close();updateGradeUI()};on('identityResume',()=>{$('resumeFile').value='';$('resumeFile').click()})}
function answerGraded(id,choice){let q=gradedQuestions.find(q=>q.id===id);if(!q||!grade().names.length||q.slide!==state.step||q.slide>unlockedThrough()||questionPassed(q)||questionHistory(q).length>=2||!Number.isInteger(choice)||choice<0||choice>3)return false;let a=grade().answers[id]??(grade().answers[id]=[]);a.push(choice);save();renderSlideQuestion();updateGradeUI();return true}
function openCheckpoint(c=currentCheckpoint()){if(!grade().names.length)return showIdentity();const cap=unlockedThrough();if(checkpoints[c].start>cap)c=gradedQuestions[cap].cp;checkpointOpen=c;const cp=checkpoints[c],qs=gradedQuestions.filter(q=>q.cp===c),taskdone=tasksPassed(c);let h='<p>This is the practical-work summary. The required two-attempt questions are on the slides; there are no additional graded questions here.</p><h3>Practical work · '+(taskdone?'5/5':'0/5 until all listed tasks are verified')+'</h3><ul class="taskChecklist">'+cp.tasks.map(([id,label,step])=>'<li><span>'+(grade().evidence[id]?'✓':'○')+' '+esc(label)+'</span><button data-task-slide="'+step+'" '+(step>cap?'disabled':'')+'>'+ (grade().evidence[id]?'Review':'Go to')+' slide '+(step+1)+'</button></li>').join('')+'</ul><h3>Reading checks · '+qs.filter(questionResolved).length+'/'+qs.length+' completed</h3><p>Raw reading credit: '+qs.reduce((n,q)=>n+questionPoints(q),0)+'/'+qs.length+'. All 36 slide checks together are scaled to 25 points.</p><ul>'+qs.map(q=>'<li>Slide '+(q.slide+1)+': '+esc(slideQuestionStatus(q))+'</li>').join('')+'</ul><div class="row"><button id="checkpointReturn">Return to lesson</button>'+(checkpointPassed(c)?'<button id="checkpointContinue" class="primary">'+(c===4?'View final report':'Continue to next section')+'</button>':'')+'</div>';modal('Practical checkpoint '+(c+1)+' · '+cp.name,h);document.querySelectorAll('[data-task-slide]').forEach(b=>b.onclick=()=>{$('modal').close();go(+b.dataset.taskSlide)});on('checkpointReturn',()=>{$('modal').close();checkpointOpen=null});on('checkpointContinue',()=>{$('modal').close();checkpointOpen=null;c===4?showReport():go(checkpoints[c+1].start)})}
function reportHTML(){const g=grade(),p=scoreParts(),raw=gradedQuestions.reduce((n,q)=>n+questionPoints(q),0),first=gradedQuestions.filter(q=>questionHistory(q)[0]===0).length,second=gradedQuestions.filter(q=>questionHistory(q).length===2&&questionHistory(q)[1]===0).length,revealed=gradedQuestions.filter(q=>questionHistory(q).length===2&&!questionPassed(q)).length;return '<h1>Packet Café · Network Control Room</h1><h2>Final learning report</h2><p><strong>Student'+(g.names.length>1?'s':'')+':</strong> '+g.names.map(esc).join(' + ')+'</p><p><strong>Score: '+totalScore()+' / 50</strong> · Reading '+p.questions+'/25 · Practical work '+p.tasks+'/25</p><p>First-attempt correct: '+first+' · Second-attempt correct: '+second+' · Answer revealed after two incorrect attempts: '+revealed+'</p><p>Reading calculation: '+raw+'/36 raw credit × 25 = '+p.questions+'/25. First-attempt correct = 1 raw credit; second-attempt correct = 0.5; two incorrect = 0. The reading subtotal is rounded to two decimal places.</p><p>Completed: '+esc(g.completedAt?new Date(g.completedAt).toLocaleString():'In progress')+'<br>Report ID: '+esc(g.sessionId)+'</p><table><tr><th>Concept group</th><th>Reading checks (raw)</th><th>Practical / 5</th></tr>'+checkpoints.map((cp,i)=>{const qs=gradedQuestions.filter(q=>q.cp===i);return '<tr><td>'+esc(cp.name)+'</td><td>'+qs.reduce((n,q)=>n+questionPoints(q),0)+'/'+qs.length+'</td><td>'+(tasksPassed(i)?5:0)+'</td></tr>'}).join('')+'</table><h2>Slide question results and attempts</h2>'+gradedQuestions.map((q,i)=>'<section><h3>Slide '+(i+1)+'. '+esc(q.q)+'</h3><p>'+esc(slideQuestionStatus(q))+' · Raw credit: '+questionPoints(q)+'/1</p><p>'+questionHistory(q).map((n,j)=>'Attempt '+(j+1)+': '+esc(q.a[n])+' ['+(n===0?'correct':'incorrect')+']').join('<br>')+'</p>'+(questionHistory(q).length===2&&!questionPassed(q)?'<p>Correct answer shown: '+esc(q.a[0])+'<br>Explanation acknowledged: '+(g.acknowledged[q.id]?'Yes':'No')+'</p>':'')+'</section>').join('')+'<h2>Verified practical work</h2>'+checkpoints.map(cp=>'<section><h3>'+esc(cp.name)+'</h3><ul>'+cp.tasks.map(([id,label])=>'<li>'+esc(label)+' — '+(g.evidence[id]?'Completed':'Incomplete')+'</li>').join('')+'</ul></section>').join('')+'<h2>Final PC 2 troubleshooting evidence</h2><p>'+esc(g.evidence.ticket?.detail||'Not completed')+'</p><p>Ticket problem: '+esc(g.finalTicket?.fault||'Not verified')+'<br>Applied PC 2 settings: IP '+esc(g.finalTicket?.ip||'')+' · gateway '+esc(g.finalTicket?.gateway||'')+' · DNS '+esc(g.finalTicket?.dns||'')+' · cable '+(g.finalTicket?.link?'connected':'not verified')+'</p>'+['local','remote','name'].map(k=>{let r=g.finalTicket?.tests?.[k];return '<p>'+esc(({local:'Local PC 1',remote:'Outside game-server IP',name:'Game-server name'})[k])+': '+(r?.ok?'Passed':'Not verified')+' · '+esc(r?.at||'')+'</p>'}).join('')+'<p>Shared partner report: both named students receive the same score. Save this report as PDF and upload it to Canvas.</p>'}
function showReport(){if(!allGradedDone())return openCheckpoint();modal('Final report · '+totalScore()+' / 50','<p>Click <strong>Save report as PDF</strong>. In the print window, choose <strong>Save as PDF</strong>, save the file, and upload it to Canvas. Partners use the same report.</p><button id="printGradedReport" class="primary">Save report as PDF</button><div class="reportPreview">'+reportHTML()+'</div>');on('printGradedReport',()=>printContent(reportHTML()))}
function progressSnapshot(){let s=JSON.parse(JSON.stringify(state));if(grade().inFlight){let i=grade().inFlight.step;s.labs[i]=fresh(i);s.assessment.inFlight=null;}return{format:GRADED_FORMAT,version:GRADED_VERSION,savedAt:new Date().toISOString(),state:s}}
function downloadProgress(){if(!grade().names.length)return showIdentity();save();let data=JSON.stringify(progressSnapshot(),null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='PacketCafe_Progress_'+grade().sessionId+'_'+new Date().toISOString().slice(0,19).replace(/[T:]/g,'-')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);modal('Progress file downloaded','<p>Keep the downloaded <strong>PacketCafe_Progress…json</strong> file in Google Drive. On your next visit, click <strong>Resume</strong> and select it.</p><p>The file includes both names, slide-question attempts and acknowledgments, answer order, points and completed tasks. An unfinished moving demonstration restarts from its beginning when restored.</p><p>This is your progress backup, not the final PDF for Canvas.</p>')}
function validateProgress(value){if(!value||value.format!==GRADED_FORMAT||![1,2].includes(value.version))throw Error('Choose a progress file saved from this graded Packet Café lesson.');let s=value.state;if(!s||!Number.isInteger(s.step)||s.step<0||s.step>35||!s.labs||Array.isArray(s.labs)||!s.checks||!s.predict||!s.explain)throw Error('This progress file is incomplete. Your current work has not changed.');let count=0;function safe(v,depth=0){if(++count>120000||depth>20)throw Error('This progress file is too large or too complex.');if(typeof v==='string'){if(v.length>250000||/<\s*(?:script|iframe|img|svg|object|style|a\b|div|input|button|\/)/i.test(v))throw Error('The progress file contains unsupported text.');return}if(v===null||typeof v==='boolean'||typeof v==='number'&&Number.isFinite(v))return;if(typeof v!=='object')throw Error('Unsupported progress value.');for(const k of Object.keys(v)){if(['__proto__','prototype','constructor'].includes(k))throw Error('Unsupported progress field.');safe(v[k],depth+1)}}safe(s);let g=s.assessment;if(!g||g.version!==value.version||!Array.isArray(g.names)||g.names.length<1||g.names.length>2||g.names.some(n=>typeof n!=='string'||!n.trim()||n.length>80)||!g.orders||!g.answers||!g.evidence||!g.observations||typeof g.sessionId!=='string'||typeof g.startedAt!=='string')throw Error('The student or checkpoint information is missing.');const isRecord=x=>x&&typeof x==='object'&&!Array.isArray(x);if(!isRecord(g.evidence)||!isRecord(g.observations)||!isRecord(g.answers)||!isRecord(g.orders))throw Error('Checkpoint records must be objects.');const taskIds=new Set(checkpoints.flatMap(c=>c.tasks.map(t=>t[0])));for(const [id,e]of Object.entries(g.evidence)){if(!taskIds.has(id)||!isRecord(e)||typeof e.at!=='string'||typeof e.detail!=='string')throw Error('The task evidence is incomplete.');}for(const [i,o]of Object.entries(g.observations)){if(!/^\d+$/.test(i)||+i>35||!isRecord(o)||!isRecord(o.actions)||!isRecord(o.tests))throw Error('The saved task history is incomplete.');for(const r of Object.values(o.tests))if(!isRecord(r)||typeof r.ok!=='boolean'||typeof r.config!=='string'||typeof r.at!=='string')throw Error('The saved test history is incomplete.');}if(g.version===1){const n=newAssessment();s.assessment={...g,version:2,orders:n.orders,answers:{},acknowledged:{},completedAt:null,migratedFrom:1};s.step=0;g=s.assessment;}if(!isRecord(g.acknowledged))throw Error('The reading acknowledgments are missing.');for(let q of gradedQuestions){const a=g.orders[q.id],h=g.answers[q.id]||[];if(!Array.isArray(a)||a.length!==4||[...a].sort().join(',')!=='0,1,2,3'||!Array.isArray(h)||h.length>2||h.some(n=>!Number.isInteger(n)||n<0||n>3)||h.includes(0)&&h.indexOf(0)!==h.length-1||g.acknowledged[q.id]!==undefined&&typeof g.acknowledged[q.id]!=='boolean'||g.acknowledged[q.id]&&(h.length!==2||h.includes(0)))throw Error('The two-attempt reading history is not valid.');}for(const [k,l]of Object.entries(s.labs)){if(!/^\d+$/.test(k)||+k>35||!l||!Array.isArray(l.ips)||l.ips.length!==3||!Array.isArray(l.links)||l.links.length!==3||!Array.isArray(l.gateway)||l.gateway.length!==3||!Array.isArray(l.dns)||l.dns.length!==3||typeof l.mask!=='string')throw Error('The saved network settings are incomplete.');for(let a of [l.ips,l.gateway,l.dns])if(a.some(x=>typeof x!=='string'||x.length>50||/[<>"'&]/.test(x)))throw Error('The saved network address contains unsupported characters.');}if(g.inFlight){if(!Number.isInteger(g.inFlight.step)||g.inFlight.step<0||g.inFlight.step>35)throw Error('The saved animation position is invalid.');s.labs[g.inFlight.step]=fresh(g.inFlight.step);g.inFlight=null;}return JSON.parse(JSON.stringify(s))}
async function previewResume(file){if(!file)return;if(file.size>5000000)return modal('Could not resume','<p>This file is too large. Select a Packet Café progress JSON file.</p>');try{let s=validateProgress(JSON.parse(await file.text()));assessmentImport=s;const old=state;state=s;const score=totalScore(),cap=unlockedThrough();state=old;modal('Resume this saved progress?',`<p><strong>${s.assessment.names.map(esc).join(' + ')}</strong></p><p>Saved slide ${s.step+1}: ${esc(lesson[s.step].title)}<br>Earned score: ${score}/50</p><p>Resuming replaces the work currently open in this browser. Save your current progress first if you need to keep it.</p><button id="confirmResume" class="primary">Resume this file</button><button id="cancelResume">Keep current work</button>`);on('confirmResume',()=>{stop();state=assessmentImport;assessmentImport=null;state.step=Math.min(state.step,unlockedThrough());save();$('modal').close();render();window.scrollTo(0,0)});on('cancelResume',()=>{assessmentImport=null;$('modal').close()})}catch(e){modal('Could not resume','<p>'+esc(e.message||'This file could not be read.')+'</p><p>Your current progress has not changed. Select the original downloaded progress file.</p>')}}
function studentHelp(){studentHelpLessonCore();$('modalBody').insertAdjacentHTML('afterbegin','<div class="gradeHint"><strong>Graded lesson · 50 points.</strong> Every slide has one required reading check: two attempts maximum. First correct earns full credit; second correct earns half; two incorrect earn zero and reveal the answer. Read and acknowledge that explanation before continuing. The 36 checks together earn up to 25 points; five practical checkpoints earn up to 25. Complete each slide’s required activity too. Save progress before leaving; Resume restores your file. Partners share one score.</div>')}
assessmentReady=true;grade();if(grade().inFlight){let i=grade().inFlight.step;state.labs[i]=fresh(i);grade().inFlight=null}state.step=Math.min(state.step,unlockedThrough());

$('prev').onclick=previousLesson;$('next').onclick=nextLesson;$('jump').onchange=()=>go(+$('jump').value);$('resetScene').onclick=()=>{state.labs[state.step]=fresh(state.step);delete state.checks[state.step];delete state.predict[state.step];render()};$('notesToggle').onclick=()=>{state.notes=!state.notes;save();$('notes').classList.toggle('show',state.notes);$('notesToggle').setAttribute('aria-pressed',String(state.notes))};$('reference').onclick=reference;$('guide').onclick=guide;$('closeModal').onclick=()=>{consoleModalActive=false;$('modal').close()};$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').close()});$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{modal('Full screen','<p>Use your browser’s full-screen command, such as F11 on Windows.</p>')}};$('replay').onclick=()=>{if(lastJourney){if(lastJourney.replay)lastJourney.replay();else journey(lastJourney.segments,lastJourney.ending)}else setCaption('Choose a demonstration or test in the workbench first. Then replay its steps here.')};$('pause').onclick=()=>{if(!motion)return;paused=!paused;if(paused){motion.pauseAt=performance.now()}else if(motion.start!==null){motion.start+=performance.now()-motion.pauseAt}$('pause').textContent=paused?'Resume':'Pause'};$('advanceJourney').onclick=()=>{if(motion&&motion.waiting)advanceSegment()};$('playback').onchange=()=>{state.playback=$('playback').value;save();if(motion&&motion.waiting&&state.playback==='auto')advanceSegment();syncJourney()};document.addEventListener('keydown',e=>{if($('modal').open||e.target.closest('input,select,textarea,summary'))return;if(e.key==='ArrowRight'){e.preventDefault();nextLesson()}if(e.key==='ArrowLeft'){e.preventDefault();previousLesson()}});render();if(!grade().names.length)showIdentity();
